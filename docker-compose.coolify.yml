# Development: SQLite in ./Database (same path as local run), hot reload
services:
  backend:
    build: ./backend
    # Keep Django private to the Compose network. Coolify (and the frontend)
    # reaches it by the service name, so publishing host port 8000 is unnecessary.
    expose:
      - "8000"
    environment:
      # Values are supplied by Coolify's Environment Variables screen. The
      # defaults preserve the local development setup when running Compose.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_PATH: ${DB_PATH:-/app/Database/db.sqlite3}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      MEDIA_ROOT: ${MEDIA_ROOT:-}
      STATIC_ROOT: ${STATIC_ROOT:-}
    volumes:
      - ./backend:/app/backend
      - ./Database:/app/Database

  frontend:
    build:
      context: ./frontend
      target: dev
    # Coolify routes the public domain to this internal port.
    expose:
      - "5173"
    environment:
      # Set NEXT_PUBLIC_API_URL in Coolify to the browser-reachable API URL.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8000}
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - backend
