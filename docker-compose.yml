# Development: SQLite in ./Database (same path as local run), hot reload
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env.example
    environment:
      DB_ENGINE: sqlite
      DB_PATH: /app/Database/db.sqlite3  # (legacy; remove this line and mount ./site below to use the site folder)
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app/backend
      - ./Database:/app/Database
      - ./themes:/app/themes
      - ./site:/app/site
      - ./backups:/app/backups
      - ./resource:/app/resource  # the library of zips (plugins, themes, languages) that comes with the product

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000   # browser -> host port
      API_URL_INTERNAL: http://backend:8000        # SSR -> compose network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
