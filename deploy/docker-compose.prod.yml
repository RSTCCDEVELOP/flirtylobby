# Production stack, lives in /opt/flirtylobby on the VPS (as docker-compose.yml)
name: flirtylobby

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX}/backend:latest
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: api.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://api.${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
      PLUGINS_DIR: /data/plugins
      THEMES_DIR: /data/themes
    volumes:
      - media:/data/media
      - static:/data/static
      - plugins:/data/plugins
      - themes:/data/themes
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}/frontend:latest
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/99-reload.sh:/docker-entrypoint.d/99-reload.sh:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - media:/data/media:ro
      - static:/data/static:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  pgdata:
  media:
  static:
  plugins:
  themes:
  certs:
  certbot-www:
