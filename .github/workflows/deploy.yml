name: Build & Deploy

# Manual only for now. Add `push: branches: [main]` here to deploy on every push.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PROJECT: easy2edit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PROJECT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}/backend:latest
            ${{ steps.vars.outputs.prefix }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMAIN }}
          tags: |
            ${{ steps.vars.outputs.prefix }}/frontend:latest
            ${{ steps.vars.outputs.prefix }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + nginx files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/nginx/*,deploy/init-letsencrypt.sh"
          target: /opt/${{ env.PROJECT }}
          strip_components: 1

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/${{ env.PROJECT }}
            mv -f docker-compose.prod.yml docker-compose.yml
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker compose pull backend frontend
            if docker compose run --rm --no-deps --entrypoint sh certbot -c 'test -d /etc/letsencrypt/live'; then
              docker compose up -d --remove-orphans
            else
              echo "No certificate yet: run ./init-letsencrypt.sh once on the VPS"
            fi
            docker image prune -f
